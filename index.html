<!DOCTYPE html>
<!--
ЗДОРОВЬЕ ВНУТРИ НАС — единая версия сайта от 11.10.2026.

ДЛЯ ЧАТА GPT / РАЗРАБОТЧИКА
1) Это референс-реализация ВСЕХ страниц сайта в одном файле. Страницы переключаются
   по хэшу (#home, #about ...). На реальном сайте они лежат отдельными файлами:
     #home → index.html          #about → about.html         #nutrition → nutrition.html
     #supplements → supplements.html   #labs → labs.html    #recipes → recipes.html
     #child-health → child-health.html #gut-health → gut-health.html
     #community → community.html #courses → courses.html     #blog → blog.html
     #contacts → contacts.html   #consultation → consultation.html
   Нужно перенести дизайн (CSS-токены, компоненты, анимации) на отдельные .html-файлы
   текущего сайта ИЛИ оставить как SPA. Тексты, ссылки и структуру меню НЕ менять.
2) Картинки: объект IM + константа BASE в <script>. Файлы лежат в корне сайта
   (ludmila-hero-hq.png.png, "Людмила Баран О себе.JPG", IMG_0262..0266.PNG, images/*.svg).
3) СОХРАНИТЬ как есть из текущего сайта (здесь только стилизованная заглушка):
   • интерактивную таблицу совместимости витаминов и минералов (supplements.html)
   • анкету по железу iron-questionnaire.html (28 вопросов)
4) ЦВЕТА (утверждены): фон #F7F5EF · чёрный #0F1A14 · тёмно-зелёного в дизайне НЕТ ·
   тёплый коричневый #7A5424 только для мелкого текста (подписи, теги) ·
   ЕДИНСТВЕННЫЙ АКЦЕНТ ТОЛЬКО ТАКОЙ: linear-gradient(to top,#e6b980 0%,#eacda3 100%)
   Шрифты: Unbounded (заголовки) + Manrope (текст). Радиусы 28–40px, кнопки-таблетки.
=====================================================================
-->
<html lang="ru">
<head>

<title>Здоровье внутри нас — Людмила Баран</title>

<style>
:root{--bg:#f7f5ef;--ink:#0f1a14;--brn:#7a5424;--mu:#5d6a62;--line:#e6e2d4;
--acc:linear-gradient(to top,#e6b980 0%,#eacda3 100%);--accs:#e8c391;--sh:0 8px 22px rgba(160,110,50,.28);color-scheme:light}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);scroll-behavior:smooth;overflow-x:clip;scroll-padding-top:96px}
body{font:16px/1.6 Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:clip}
h1,h2,h3{font-family:Unbounded,system-ui,sans-serif;font-weight:700;line-height:1.12;letter-spacing:-.01em}
a{color:inherit}[hidden]{display:none!important}
.w{max-width:1280px;margin:0 auto;padding:0 clamp(14px,3vw,28px)}
mark{display:inline-block;background:var(--acc);color:var(--ink);border-radius:.28em;padding:.02em .2em;box-shadow:var(--sh);transform:rotate(-1.5deg)}
.prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:99;transform-origin:0 50%;transform:scaleX(0);background:var(--acc)}
/* header */
.hd{position:sticky;top:0;z-index:50;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.nv{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-radius:999px;padding:9px 9px 9px 24px;box-shadow:0 8px 30px rgba(15,26,20,.07)}
.lg{font:700 14px/1.05 Unbounded,sans-serif;text-decoration:none;white-space:nowrap}.lg small{display:block;font:500 9px Manrope,sans-serif;letter-spacing:.24em;color:var(--mu);margin-top:4px}
nav{display:flex;gap:2px;margin:0 auto}
nav a,nav .mb{padding:9px 14px;border-radius:999px;font:500 14px Manrope,sans-serif;text-decoration:none;color:var(--ink);background:none;border:0;cursor:pointer;white-space:nowrap;transition:background .25s}
nav a:hover,nav .mb:hover{background:var(--bg)}nav .on{background:var(--ink)!important;color:#fff}
.more{position:relative}.dd{position:absolute;top:calc(100% + 10px);right:0;background:#fff;border-radius:22px;padding:8px;min-width:200px;box-shadow:0 20px 50px rgba(15,26,20,.16);display:none}
.more.open .dd{display:grid;animation:pop .3s}.dd a{display:block}
.bg{display:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--bg);font-size:20px;cursor:pointer}

.btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(15,26,20,.22)}
.btn.a{background:var(--acc);color:var(--ink);box-shadow:var(--sh)}
.btn.a::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 3.8s ease-in-out infinite}
.btn.o{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
@keyframes sheen{60%,100%{transform:translateX(120%)}}
.bts{display:flex;gap:12px;flex-wrap:wrap}
/* reveal */
.rv{opacity:0;transform:translateY(30px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*70ms)}
.rv.in{opacity:1;transform:none}
.pg:not([hidden]){animation:pg .6s cubic-bezier(.2,.7,.2,1)}@keyframes pg{from{opacity:0;transform:translateY(14px)}}

.tx{position:relative;z-index:2;padding:clamp(26px,5vw,72px);max-width:min(660px,64%)}

.h1{font-size:clamp(32px,5.1vw,74px);text-transform:uppercase}

.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}

/* sections */
.sec{padding:clamp(30px,5vw,64px) 0}
.sh{margin-bottom:28px}.sh h2,.h2{font-size:clamp(24px,3.3vw,42px)}.sh .lead{margin:12px 0 0}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}

.card:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(15,26,20,.08)}

.card h3{font-size:clamp(17px,1.7vw,21px);margin-bottom:8px}.card p,.card li{color:var(--mu);font-size:15px}
.card ul{list-style:none;padding:0;margin-top:12px}.card li{padding:7px 0 7px 26px;position:relative}
.card li::before{content:"";position:absolute;left:2px;top:15px;width:12px;height:6px;border-left:2px solid #c9964f;border-bottom:2px solid #c9964f;transform:rotate(-45deg)}
.cl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.num{display:inline-grid;place-items:center;min-width:42px;height:42px;border-radius:50%;background:var(--acc);font:700 14px Unbounded,sans-serif;margin-bottom:16px;padding:0 6px}

.dk{background:var(--ink);color:#fff;border-color:transparent}.dk p,.dk li{color:#b3beb6}.dk h3{color:#fff}.dk .mo{color:#eacda3}
.gr{background:var(--acc);color:var(--ink);border-color:transparent}.gr p{color:#4b3a1c}
/* bento */
.bn{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.bc{position:relative;overflow:hidden;border-radius:32px;min-height:270px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:26px;text-decoration:none;grid-column:span 4;background:var(--acc)}

.orb{position:relative;width:min(100%,340px);aspect-ratio:1;margin:auto}

.cta{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;position:relative;overflow:hidden;background:var(--ink);color:#fff;border-radius:40px;padding:clamp(28px,5vw,60px);margin:clamp(24px,4vw,50px) 0}

.cta>*{position:relative;z-index:2}.cta small{display:block;color:#b3beb6;margin-top:10px;font-size:13px}
/* tables, steps */
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:26px}
table{width:100%;border-collapse:collapse;min-width:640px;font-size:15px}th,td{text-align:left;padding:16px 20px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}td{color:var(--mu)}td:first-child{font-weight:700;color:var(--ink)}tr:last-child td{border:0}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;align-items:stretch}
.st .card{display:flex;flex-direction:column}.st .arr{display:none}
.lg2{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.lg2 span{padding:7px 14px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center}.lg2 i{width:10px;height:10px;border-radius:50%}

.ckb p{color:#5b4220;font-size:14px}.ckb .btn.a{background:var(--ink);color:#fff;box-shadow:none}.ckb .btn.o{box-shadow:none}.cnt{font:700 34px Unbounded,sans-serif}.cnt s{text-decoration:none;color:#8a6a3a;font-size:20px}
.cnt.pulse{animation:pu .35s}@keyframes pu{50%{transform:scale(1.18);color:#7a5424}}
.ckg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.cg{background:#fff;border:1px solid var(--line);border-radius:30px;overflow:hidden}
.cgh{display:flex;gap:16px;align-items:center;padding:20px 24px;background:#f1efe5}.cgh .n{font:500 30px Unbounded,sans-serif;color:#c9964f}

.it{display:flex;gap:14px;padding:18px 24px;cursor:pointer;border-top:1px solid var(--line)}.it:first-of-type{border:0}

const CARDS={
nutrition:{eb:'Принципы рациона',t:'Питание',lead:'Понятная система рациона без жёстких запретов: баланс, разнообразие и привычки, которые можно поддерживать.',img:'nutrition',foot:FOOT,items:[
 {t:'Тарелка баланса',s:[['Принцип','Практический ориентир для основного приёма пищи: значительную часть тарелки занимают овощи, добавляется источник белка и источник углеводов, а также небольшое количество жиров. Это не строгая формула и не требует взвешивания каждого продукта.'],['Что даёт','Помогает визуально разнообразить рацион и помнить о белке, овощах и источниках энергии. Состав и порции зависят от возраста, активности, целей, аппетита и состояния здоровья.'],['На практике','Меняйте овощи, крупы и источники белка в течение недели — разнообразие обычно важнее поиска одного «идеального» продукта.']]},
 {t:'Режим питания',s:[['Главная идея','Универсального количества приёмов пищи нет. Кому-то комфортны три основных приёма, кому-то нужны дополнительные перекусы. Важнее устойчивый режим, который соответствует распорядку дня и помогает замечать голод и насыщение.'],['На что смотреть','Длительные интервалы могут быть комфортны не всем. Оцените энергию в течение дня, выраженность голода к вечеру и то, насколько режим реально соблюдать.'],['Без крайностей','Не нужно превращать часы в жёсткое правило. При медицинских состояниях режим питания лучше согласовывать с врачом или профильным специалистом.']]},
 {t:'Устойчивые привычки',s:[['Почему важны','Рацион работает не один день, поэтому полезнее небольшие действия, которые можно повторять месяцами: держать дома базовые продукты, планировать несколько блюд, добавлять овощи и постепенно расширять разнообразие.'],['Как начать','Выберите одно изменение на ближайшую неделю: например, добавить овощи к обеду или подготовить продукты для завтрака вечером. Когда действие становится привычным, добавляйте следующее.'],['Подход','Не делите еду на «идеальную» и «запрещённую». Гибкость помогает встроить питание в обычную жизнь, а не подчинять жизнь питанию.']]}]},
recipes:{eb:'Идеи на каждый день',t:'Рецепты',lead:'Простые идеи блюд, которые помогают разнообразить рацион без ощущения, что полезное питание — сложный проект.',img:'recipes',foot:FOOT,items:[
 {t:'Завтраки',s:[['Что включить','Удобная основа завтрака — источник белка, продукты с клетчаткой и, по желанию, источник полезных жиров. Примеры: яйца с овощами и цельнозерновым хлебом; натуральный йогурт с ягодами, овсянкой и орехами; творог с фруктами.'],['Зачем','Сбалансированный завтрак помогает сделать приём пищи более сытным и разнообразным. Не обязательно завтракать сразу после пробуждения — режим стоит подбирать под аппетит и распорядок дня.'],['Идея','Омлет с овощами + цельнозерновой тост + фрукт. Порции подбираются индивидуально.']]},
 {t:'Обед и ужин',s:[['Как собрать','Простой ориентир: овощи и зелень + источник белка + крупа, картофель или другой источник сложных углеводов. Подойдут рыба, птица, яйца, бобовые, тофу; гречка, рис, булгур; свежие или приготовленные овощи.'],['Зачем','Так проще получать разнообразные питательные вещества и не строить рацион вокруг одного продукта. Ужин не обязан быть только «лёгким»: его состав зависит от общего рациона и режима.'],['Идея','Запечённая рыба + гречка + большой овощной салат с оливковым маслом.']]},
 {t:'Перекусы',s:[['Когда нужны','Перекус — не обязательное правило. Он полезен, когда между основными приёмами пищи большой интервал или появляется физический голод. Если три основных приёма пищи комфортны, добавлять перекус специально не нужно.'],['Что выбрать','Фрукт + орехи; натуральный йогурт + ягоды; овощи + хумус; цельнозерновой хлебец + творожный сыр. Хорошо, когда перекус содержит не только быстрые углеводы.'],['Зачем','Продуманный перекус может помочь комфортно дождаться следующего приёма пищи и добавить в рацион фрукты, овощи, белок или полезные жиры.']]}]},
blog:{eb:'Статьи и памятки',t:'Полезные материалы',lead:'Короткие материалы о питании, привычках, витаминах и лабораторных показателях — без информационного шума.',img:'blog',foot:FOOT,items:[
 {t:'Этикетки',s:[['С чего начать','Смотрите не на рекламные надписи на лицевой стороне, а на название продукта, список ингредиентов, пищевую ценность и размер порции. Ингредиенты обычно перечисляются по убыванию массы.'],['Что сравнивать','При выборе похожих продуктов удобно сравнивать показатели на 100 г или 100 мл: белок, клетчатку, насыщенные жиры, сахар и соль — в зависимости от категории продукта.'],['Главная мысль','Один ингредиент редко делает продукт автоматически «хорошим» или «плохим». Этикетка помогает понять состав, а решение зависит от частоты употребления и всего рациона.']]},
 {t:'Сон и восстановление',s:[['Почему это важно','Сон связан с вниманием, настроением, восстановлением и регуляцией аппетита. Питание не может полностью компенсировать хронический недосып.'],['Что помогает','Стабильное время сна и подъёма, спокойный вечерний ритуал, комфортная тёмная спальня и умеренное употребление кофеина во второй половине дня могут поддерживать режим сна.'],['Когда обратиться','Если проблемы со сном сохраняются, сопровождаются выраженной дневной сонливостью, храпом или остановками дыхания, стоит обсудить это с врачом.']]},
 {t:'Разбор популярных мифов',s:[['«После 18:00 есть нельзя»','Само время на часах не делает еду вредной. Важнее общий рацион, режим сна, индивидуальный график и количество пищи. Некоторым людям комфортнее закончить плотный ужин заранее до сна.'],['«Углеводы нужно исключить»','Углеводы — большая группа продуктов. Цельнозерновые продукты, бобовые, овощи и фрукты могут быть частью полноценного рациона и дают в том числе клетчатку.'],['«Детокс очищает организм»','Организм постоянно использует собственные системы обмена и выведения веществ. Жёсткие «детокс»-диеты не заменяют работу печени и почек и могут неоправданно ограничивать рацион.']]}]},
supplements:{eb:'БАДы и витамины',mb:'БАДЫ И ВИТАМИНЫ',t:'БАДы и витамины',lead:'Добавки — не замена полноценному рациону. Разбираем, зачем организму нужны отдельные нутриенты, где они встречаются в пище и когда добавку действительно стоит обсуждать со специалистом.',img:'supp',foot:SFOOT,items:[
 {t:'Витамин D',s:[['Зачем организму','Витамин D участвует в поддержании нормального обмена кальция и фосфора, здоровья костей и нормальной работы иммунной системы.'],['Источники','Небольшое количество поступает с пищей — например, с жирной рыбой, яйцами и обогащёнными продуктами. Существенная часть может образовываться в коже под действием солнечного света.'],['Когда обсуждать добавку','Потребность в добавке и дозировке лучше определять индивидуально с учётом питания, образа жизни, сезона, факторов риска и при необходимости лабораторной оценки.'],['Важно','Избыточный приём витамина D может быть вреден. Высокие дозы без медицинских показаний использовать не следует.']]},
 {t:'Омега-3',s:[['Зачем организму','Омега-3 — семейство полиненасыщенных жирных кислот. EPA и DHA входят в состав клеточных мембран; DHA особенно важна для тканей мозга и сетчатки.'],['Пищевые источники','EPA и DHA содержатся прежде всего в жирной морской рыбе и морепродуктах. Растительные продукты — например, лён, чиа и грецкие орехи — содержат ALA, которая превращается в EPA и DHA лишь частично.'],['Когда обсуждать добавку','Добавку можно обсуждать, если рыба редко присутствует в рационе или есть конкретная рекомендация специалиста. Важны количество EPA+DHA и качество продукта, а не только крупная цифра «рыбий жир» на упаковке.'],['Важно','При приёме лекарств, влияющих на свёртывание крови, перед использованием высоких доз омега-3 необходима консультация врача.']]},
 {t:'Магний',s:[['Зачем организму','Магний нужен для множества ферментативных реакций, нормальной работы мышц и нервной системы, энергетического обмена и поддержания электролитного баланса.'],['Пищевые источники','Орехи, семена, бобовые, цельнозерновые продукты, листовая зелень и некоторые другие продукты позволяют получать магний из обычного рациона.'],['Когда обсуждать добавку','Добавка не должна автоматически назначаться при любой усталости или судорогах. Сначала стоит оценить рацион, симптомы, лекарства и медицинский контекст.'],['Важно','Некоторые формы и дозы магния могут вызывать диарею. При заболеваниях почек добавки магния следует обсуждать с врачом.']]},
 {t:'Железо',more:'Подробнее и опрос →',a:['iron-questionnaire.html','Пройти анкету по железу →'],s:[['Зачем организму','Железо необходимо для образования гемоглобина и переноса кислорода, а также участвует в работе ряда ферментов.'],['Пищевые источники','Гемовое железо содержится в мясе и других продуктах животного происхождения. Негемовое — в бобовых, цельных злаках, семенах и зелени; витамин C может улучшать его усвоение из растительной пищи.'],['Когда обсуждать добавку','Препараты или добавки железа обычно рассматривают после оценки общего анализа крови и показателей обмена железа, включая ферритин, с учётом симптомов и причины возможного дефицита.'],['Важно','Железо не стоит принимать «на всякий случай»: избыток также может быть вреден, а причина дефицита иногда требует отдельного медицинского поиска.']]},
 {t:'Витамин B12',s:[['Зачем организму','Витамин B12 участвует в кроветворении, работе нервной системы и обменных процессах.'],['Пищевые источники','Основные естественные источники — продукты животного происхождения. При полностью растительном рационе необходим надёжный источник B12 из обогащённых продуктов или добавок.'],['Когда обсуждать добавку','Особое внимание B12 может потребоваться при веганском рационе, некоторых заболеваниях ЖКТ, после отдельных операций и при использовании некоторых лекарств.'],['Важно','Симптомы дефицита неспецифичны. Тактику лучше выбирать по рациону, факторам риска и медицинской оценке, а не только по самочувствию.']]},
 {t:'Кальций',s:[['Зачем организму','Кальций важен для костей и зубов, сокращения мышц, передачи нервных сигналов и других физиологических процессов.'],['Пищевые источники','Молочные продукты, обогащённые растительные напитки, некоторые виды рыбы с костями, тофу с кальцием и отдельные зелёные овощи могут вносить вклад в потребление кальция.'],['Когда обсуждать добавку','Сначала полезно оценить, сколько кальция поступает с едой. Добавка может обсуждаться, если рацион не покрывает потребность или есть медицинские показания.'],['Важно','Больше — не значит лучше. Добавки кальция могут взаимодействовать с некоторыми лекарствами, поэтому дозу и время приёма важно согласовать со специалистом.']]}]},
labs:{eb:'Лабораторные показатели',t:'Анализы',lead:'Один показатель редко отвечает на все вопросы. Раздел помогает понять, что обычно исследуют разные лабораторные маркеры.',img:'labs',foot:FOOT,items:[
 {t:'Общий анализ крови',s:[['Что показывает','Общий анализ крови оценивает клетки крови: эритроциты и гемоглобин, лейкоциты, тромбоциты и ряд расчётных индексов. Он помогает врачу увидеть общую картину и решить, нужны ли дополнительные исследования.'],['Зачем нужен','Может дать ориентиры при жалобах на слабость, утомляемость, частые инфекции, кровоточивость и других состояниях. Один показатель не трактуют изолированно: важны симптомы, анамнез и референсы конкретной лаборатории.'],['Важно помнить','ОАК не ставит диагноз сам по себе. Отклонения обсуждают с врачом, особенно если они выражены или сохраняются при повторном исследовании.']]},

$('#mm').innerHTML=[...MAIN,...MORE].map(navLink).join('');
$('#fnav').innerHTML=[...MAIN,...MORE,'consultation'].map(k=>`<a href="#${k}">${T[k]}</a>`).join('');
$('#mb').onclick=e=>{e.stopPropagation();const m=$('.more');m.classList.toggle('open');$('#mb').setAttribute('aria-expanded',m.classList.contains('open'))};
$('#bg').onclick=()=>{const open=$('#mm').classList.toggle('open');$('#bg').setAttribute('aria-expanded',String(open))};
document.addEventListener('click',e=>{if(!e.target.closest('.more'))$('.more').classList.remove('open')});

function go(){
  let id=location.hash.slice(1);if(!PAGES[id])id='home';
  $$('.pg').forEach(s=>s.hidden=s.id!=='p-'+id);
  $$('#nav a,#mm a').forEach(a=>a.classList.toggle('on',a.dataset.k===id));
  $('#mb').classList.toggle('on',MORE.includes(id));
  $('.more').classList.remove('open');$('#mm').classList.remove('open');$('#bg').setAttribute('aria-expanded','false');
  document.title=(id==='home'?'Здоровье внутри нас':T[id]+' — Людмила Баран')+(id==='home'?' — Людмила Баран':'');
  scrollTo({top:0,behavior:'instant'});sc();
}
addEventListener('hashchange',go);go();

/* появление при прокрутке */
$$('.rv').forEach(e=>e.style.setProperty('--i',[...e.parentElement.children].indexOf(e)%6));
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1,rootMargin:'0px 0px -4% 0px'});
$$('.rv').forEach(e=>io.observe(e));
function sc(){const h=document.documentElement;$('#prog').style.transform=`scaleX(${scrollY/Math.max(1,h.scrollHeight-innerHeight)})`}
addEventListener('scroll',sc,{passive:true});

/* бегущая подсветка табов на главной */
let ti=0;setInterval(()=>{const t=$$('#tabs a');if(!t.length||$('#p-home').hidden)return;t.forEach((a,i)=>a.classList.toggle('on',i===ti%t.length));ti++},2200);

/* окна, лайтбокс, прокрутка к блокам */
const md=$('#md'),lb=$('#lb');
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-md]');
  if(c){const[k,i]=c.dataset.md.split(':'),b=CARDS[k],x=b.items[+i];
    md.innerHTML=`<button class="x" data-close aria-label="Закрыть">×</button><div class="mi"><div class="eb">${b.mb||'ЗДОРОВЬЕ ВНУТРИ НАС'}</div><h2>${x.t}</h2>${x.s.map(([h,t])=>`<h3>${h}</h3><p>${t}</p>`).join('')}${x.a?A(x.a[0],x.a[1],'btn a'):''}<small class="ft">${b.foot}</small></div>`;md.showModal();return}
  const l=e.target.closest('[data-lb]');
  if(l){const[f,t]=l.dataset.lb.split('|');lb.innerHTML=`<button class="x" data-close aria-label="Закрыть">×</button><img src="${src(f)}" alt="${t}"><p>Иллюстрация предоставлена для ознакомления. Не используйте её как самостоятельную схему лечения или назначения добавок.</p>`;lb.showModal();return}
  const s=e.target.closest('[data-sc]');if(s){const t=document.getElementById(s.dataset.sc);t&&t.scrollIntoView({behavior:'smooth'});return}
  if(e.target.closest('[data-close]')||e.target===md||e.target===lb){md.close();lb.close()}
});

/* чек-лист обследований */
const cnt=$('#cnt');
function upd(){cnt.innerHTML=`${$$('.it input:checked').length} <s>/ ${TOTAL}</s>`;cnt.classList.remove('pulse');void cnt.offsetWidth;cnt.classList.add('pulse')}
$$('.it input').forEach(i=>i.addEventListener('change',upd));
$('#rs').onclick=()=>{$$('.it input').forEach(i=>i.checked=false);upd()};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
$('#cp').onclick=async()=>{const t=$$('.it input:checked').map(i=>i.dataset.n).join('\n');if(!t)return toast('Сначала отметьте исследования');
  try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}toast('Список скопирован')};
</script>
<script defer src="assets/nutrient-compatibility.js?v=1"></script>
</body>
</html>
